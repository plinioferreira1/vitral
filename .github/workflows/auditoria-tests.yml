name: Auditoria de Integridade

on:
  push:
    branches:
      - audit/financeiro-demandas-integridade-20261125
  pull_request:
    paths:
      - "src/lib/demandas/**"
      - "audits/**"
      - ".github/workflows/auditoria-tests.yml"

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Testes
        run: npm test
      - name: TypeScript
        run: npm run typecheck
