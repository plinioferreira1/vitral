name: Aplicar migrations no Supabase

# Roda sozinho toda vez que uma migration nova é enviada pra main.
# Também pode ser disparado manualmente pela aba "Actions" no GitHub.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Marcar migrations 0001-0007 como já aplicadas (rodar só uma vez, na primeira configuração)"
        type: boolean
        default: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: "Diagnóstico (não revela os valores, só confirma se existem)"
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN está vazio ou não foi encontrado"
          else
            echo "::notice::SUPABASE_ACCESS_TOKEN presente, tamanho: ${#SUPABASE_ACCESS_TOKEN} caracteres"
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD está vazio ou não foi encontrado"
          else
            echo "::notice::SUPABASE_DB_PASSWORD presente, tamanho: ${#SUPABASE_DB_PASSWORD} caracteres"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Conectar ao projeto Supabase
        run: supabase link --project-ref udarzsleyxcafttkkgbv --password "$SUPABASE_DB_PASSWORD" --yes --debug
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      # Passo único de configuração inicial: as migrations 0001 a 0007
      # já tinham sido aplicadas manualmente (colando no SQL Editor)
      # antes dessa automação existir. Esse passo só marca elas como
      # "já aplicadas" no histórico do Supabase, sem executar de novo
      # (o que quebraria, já que as tabelas já existem). Só roda se
      # a pessoa marcar a opção "bootstrap" ao disparar manualmente.
      - name: "Configuração inicial (só na primeira vez)"
        if: github.event.inputs.bootstrap == 'true'
        run: |
          for v in 0001 0002 0003 0004 0005 0006 0007; do
            supabase migration repair --status applied "$v" --password "$SUPABASE_DB_PASSWORD" || true
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Aplicar migrations pendentes
        run: |
          set +e
          supabase db push --password "$SUPABASE_DB_PASSWORD" > /tmp/db_push_output.txt 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            echo "::error::$(tail -c 1200 /tmp/db_push_output.txt | tr '\n' ' ')"
          fi
          cat /tmp/db_push_output.txt
          exit $STATUS
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Conferir estado das migrations
        if: always()
        run: supabase migration list --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
